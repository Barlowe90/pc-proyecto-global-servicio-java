name: ia

# Se ejecuta desde el workflow de main y no hace checkout del código de la PR.
# Así puede comentar también en PR de forks sin ejecutar código no confiable.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número de la PR"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Resumir PR con IA
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          if [[ -z "$OLLAMA_API_KEY" ]]; then
            echo "::warning::Falta configurar OLLAMA_API_KEY"
            gh pr comment "$PR" --body "La IA ha fallado"
            exit 0
          fi

          # El diff de la contribución se trata como texto: no se ejecuta.
          diff="$(gh pr diff "$PR")"
          diff="${diff:0:100000}"

          payload="$(jq -n --arg diff "$diff" '{
            model: "gpt-oss:120b",
            stream: false,
            messages: [{
              role: "user",
              content: ("Resume los cambios de esta PR:\n\n" + $diff)
            }]
          }')"

          resumen="$(curl -fsS https://ollama.com/api/chat \
            -H "Authorization: Bearer $OLLAMA_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" | jq -er '.message.content')" || resumen="La IA ha fallado"

          gh pr comment "$PR" --body "$resumen"
